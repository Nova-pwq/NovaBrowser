<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>NovaBrowser</title>
<style>
:root{--bg:#141414;--bg2:#1c1c1c;--bg3:#262626;--tx:#f2f2f2;--mu:#9a9a9a;--ac:#6c3df5;--ac-l:#a994ff;--ac-l2:#b8a4ff;--ac-l3:#c9b6ff;--b1:#5a35e8;--b2:#8a3df5;--glow:#8a5dff;--pwbg:#2a2150}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Segoe UI,system-ui,sans-serif}
body{display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;padding:6px 8px 0;background:#0f0f0f;align-items:flex-end}
.tab{display:flex;align-items:center;gap:8px;max-width:200px;min-width:110px;padding:7px 10px;background:var(--bg2);border-radius:8px 8px 0 0;font-size:13px;cursor:pointer;color:var(--mu)}
.tab.on{background:var(--bg);color:var(--tx)}.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab b{font-weight:400;opacity:.6}.tab b:hover{opacity:1}
#newtab{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer;padding:4px 10px}
#bar{display:flex;gap:6px;padding:8px;background:var(--bg)}
#bar button{background:none;border:0;color:var(--tx);font-size:16px;width:32px;height:32px;border-radius:50%;cursor:pointer}
#bar button:hover{background:var(--bg3)}
#addr{flex:1;background:var(--bg3);border:1px solid transparent;color:var(--tx);border-radius:18px;padding:0 16px;font-size:14px;outline:none}
#addr:focus{border-color:var(--ac)}
#views{flex:1;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}.view.on{display:block}
webview{width:100%;height:100%}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:22px;
 background:radial-gradient(circle at 15% 10%,#2a1a66 0,transparent 40%),radial-gradient(circle at 90% 95%,#2a1a66 0,transparent 35%)}
.home .logo{width:120px;height:120px;border-radius:50%}.home h1{margin:0;font-weight:600;letter-spacing:1px}
.sbox{width:min(640px,86%);display:flex;background:var(--bg3);border-radius:28px;border:1px solid #333;padding:4px}
.sbox input{flex:1;background:none;border:0;color:var(--tx);font-size:17px;padding:12px 18px;outline:none}
.sbox button{background:var(--ac);color:#fff;border:0;border-radius:24px;padding:0 22px;font-size:15px;cursor:pointer}
.engs{display:flex;gap:10px;color:var(--mu);font-size:13px}
.res{max-width:820px;margin:0 auto;padding:20px 24px 60px}
.r{margin-bottom:24px}.r .top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.r .top img{width:18px;height:18px;border-radius:4px}
.r a.t{display:block;margin:4px 0;font-size:19px;color:var(--ac-l);text-decoration:none;cursor:pointer}.r a.t:hover{text-decoration:underline}
.r p{margin:0;color:#c9c9c9;font-size:14px;line-height:1.5}
.eb{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;margin-left:auto}
.eb.google{background:#4285f4}.eb.bing{background:#008373}.eb.firefox{background:#de5833}
.info{color:var(--mu);padding:30px;text-align:center}
.bs{margin-left:auto;display:flex;gap:4px}.bs img{width:22px;height:22px;border-radius:50%;background:#fff;padding:3px}
.stats{color:var(--mu);font-size:12px;margin-bottom:18px;display:flex;gap:14px}.stats img{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

.home{background:var(--bg);position:relative;overflow:hidden}
.home::before,.home::after{content:'';position:absolute;width:460px;height:460px;border-radius:50%;filter:blur(100px);opacity:.4;pointer-events:none;animation:drift 11s ease-in-out infinite alternate}
.home::before{background:var(--b1);top:-140px;left:-120px}.home::after{background:var(--b2);bottom:-160px;right:-120px;animation-delay:-5s}
.home>*{position:relative;z-index:1;animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.home .logo{animation:up .8s both,float 4s ease-in-out .8s infinite,glow 3s ease-in-out infinite;box-shadow:0 0 40px color-mix(in srgb,var(--ac) 50%,transparent)}
.home h1{background:linear-gradient(90deg,#fff,var(--ac-l2),#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s .15s both,shine 4s linear infinite}
.home .sbox{animation-delay:.3s;transition:box-shadow .3s,border-color .3s,transform .3s}
.sbox:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent),0 0 30px color-mix(in srgb,var(--ac) 38%,transparent);transform:scale(1.02)}
.sbox button{transition:transform .2s,box-shadow .2s,filter .2s}.sbox button:hover{transform:scale(1.06);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 67%,transparent);filter:brightness(1.15)}.sbox button:active{transform:scale(.94)}
.home .engs{animation-delay:.45s;gap:14px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#ffffff0d;border:1px solid #ffffff14;border-radius:22px;color:var(--tx);font-size:14px;transition:transform .25s,background .25s,box-shadow .25s;animation:pop .5s calc(.6s + var(--i)*.12s) both}
.chip:hover{transform:translateY(-4px) scale(1.06);background:color-mix(in srgb,var(--ac) 20%,transparent);box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 25%,transparent)}
.chip img{width:22px;height:22px;object-fit:contain}
.tab{animation:pop .25s both;transition:background .2s,transform .2s}.tab:hover{transform:translateY(-1px);background:var(--bg3)}
#bar button{transition:background .2s,transform .2s}#bar button:hover{transform:scale(1.15)}#bar button:active{transform:scale(.9) rotate(-20deg)}
#addr{transition:box-shadow .25s,border-color .25s}#addr:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.res{animation:fade .4s both}.stats span{animation:pop .4s both}
.r{animation:up .55s calc(var(--i)*.06s + .1s) both;padding:12px 14px;margin:0 -14px 10px;border-radius:12px;transition:background .25s,transform .25s}
.r:hover{background:#ffffff08;transform:translateX(6px)}
.bs img{object-fit:contain;transition:transform .25s}.bs img:hover{transform:scale(1.3) rotate(8deg)}
.loader{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:var(--mu)}
.lg{display:flex;gap:22px}.lg img{width:48px;height:48px;object-fit:contain;animation:bounce 1.1s calc(var(--i)*.18s) ease-in-out infinite}
.bar{width:240px;height:4px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac-l2));border-radius:4px;animation:slide 1.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes glow{0%,100%{box-shadow:0 0 30px color-mix(in srgb,var(--ac) 38%,transparent)}50%{box-shadow:0 0 60px var(--glow)}}
@keyframes shine{to{background-position:200% center}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,60px) scale(1.25)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.15)}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

webview.view.on{display:inline-flex}
button{position:relative;overflow:hidden;font-family:inherit}
.rip{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rip .65s linear;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sbox button::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:sweep 3s infinite}
@keyframes sweep{0%{left:-60%}60%,100%{left:130%}}
button.chip{cursor:pointer;color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac-l);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 50%,transparent);transform:translateY(-3px)}
.hint{color:var(--mu);font-size:12px}
#modes{display:flex;gap:4px;align-items:center;margin-left:4px;padding:3px;background:var(--bg3);border-radius:20px}
#bar .mini{width:32px;height:32px;font-size:15px;color:var(--tx);display:flex;align-items:center;justify-content:center;transition:transform .2s,background .25s,box-shadow .25s}
#bar .mini img{width:20px;height:20px;object-fit:contain}
#bar .pick.on{background:var(--ac);box-shadow:0 0 14px color-mix(in srgb,var(--ac) 67%,transparent)}
#bar .mini:hover{transform:scale(1.18) rotate(-6deg)}
#bar #rel:hover{transform:rotate(180deg)}
.r .top .bs{order:1;margin-left:0}.r .top>span:not(.bs){order:2}.bs img{width:24px;height:24px}

#views{background:#222328 url(assets/bg.jpg) center/cover no-repeat}
.home{background:transparent!important}
.view:has(.res,.loader)::before,.view:has(.res,.loader)::after{content:'';position:fixed;width:460px;height:460px;border-radius:50%;filter:blur(100px);opacity:.3;pointer-events:none;animation:drift 11s ease-in-out infinite alternate;z-index:0}
.view:has(.res,.loader)::before{background:var(--b1);top:60px;left:-140px}
.view:has(.res,.loader)::after{background:var(--b2);bottom:-160px;right:-120px;animation-delay:-5s}
.res,.loader{position:relative;z-index:1}
.r{background:#16161acc;border:1px solid #ffffff0f;backdrop-filter:blur(6px)}
.r:hover{background:#262633d9;border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
.stats{background:#16161acc;padding:8px 14px;border-radius:20px;width:fit-content}

.ic{width:18px;height:18px;flex:none}
#bar button{display:flex;align-items:center;justify-content:center}
#bar button.on#pinb,#pinb.on{background:var(--ac)}
.sbox button{display:flex;align-items:center;gap:6px}
.tab .fav{width:16px;height:16px;border-radius:4px;flex:none}.tab b{display:flex}.tab b .ic{width:14px;height:14px}
.tab.pinned{min-width:0;width:44px;padding:7px 12px;justify-content:center}.tab.pinned span,.tab.pinned b{display:none}
.tab.pinned .fav{box-shadow:0 0 0 2px var(--ac)}
#pwbar{display:none;align-items:center;gap:12px;padding:8px 14px;background:var(--pwbg);border-bottom:1px solid var(--ac);font-size:14px}
#pwbar.on{display:flex;animation:up .3s both}
#settings{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
#settings.on{display:flex;animation:fade .25s}
.panel{width:min(620px,92%);max-height:86%;overflow:auto;background:#1c1c22;border:1px solid #333;border-radius:18px;padding:22px;animation:pop .3s}
.panel h2{margin:0 0 6px;display:flex;align-items:center;gap:10px}
.panel h3{margin:20px 0 8px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);color:var(--tx);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:var(--ac);transform:translateY(-2px)}
.pw{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#ffffff08;border-radius:10px;margin-bottom:6px;font-size:13px}.pw span{flex:1}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}

.spanel{width:min(900px,94%);height:min(640px,88%);display:grid;grid-template-columns:220px 1fr;background:#1c1c22;border:1px solid #333;border-radius:18px;overflow:hidden;animation:pop .3s}
.snav{background:#16161b;padding:18px 10px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #2a2a33;overflow-y:auto}
.snav h2{margin:2px 10px 16px;font-size:18px;display:flex;align-items:center;gap:10px}
.snav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mu);padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.snav button:hover{background:#ffffff0d;color:var(--tx)}.snav button.on{background:var(--ac);color:#fff}
.sbody{overflow-y:auto;padding:22px 26px}.sbody .st{margin:0 0 18px;font-size:22px;font-weight:600;display:flex;align-items:center}
.scard{background:#ffffff08;border:1px solid #ffffff10;border-radius:14px;padding:4px 16px;margin-bottom:14px;animation:up .35s both}
.scard .row{padding:13px 0;border-bottom:1px solid #ffffff0d;justify-content:space-between;font-size:14px}.scard .row:last-child{border-bottom:0}
.sub{color:var(--mu);font-size:12px;margin-top:2px}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:2px}.seg button{border:0;background:none;color:var(--mu);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}.seg button.on{background:var(--ac);color:#fff}
input.tg{appearance:none;-webkit-appearance:none;width:42px!important;height:24px!important;border-radius:12px;background:#4a4a55;position:relative;cursor:pointer;flex:none;transition:background .2s}
input.tg::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
input.tg:checked{background:var(--ac);animation:none!important}input.tg:checked::after{left:21px}
#settings input:not([type=checkbox]):not([type=file]){background:var(--bg3);color:var(--tx);border:1px solid #333;border-radius:10px;padding:9px 12px;outline:none;font:inherit;font-size:14px}
#settings input:not([type=checkbox]):focus{border-color:var(--ac)}
@media (max-width:700px){.spanel{grid-template-columns:1fr;grid-template-rows:auto 1fr}.snav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid #2a2a33}.snav h2{display:none}}
.panel>*{animation:up .45s both}.panel>:nth-child(2){animation-delay:0.10s}.panel>:nth-child(3){animation-delay:0.15s}.panel>:nth-child(4){animation-delay:0.20s}.panel>:nth-child(5){animation-delay:0.25s}.panel>:nth-child(6){animation-delay:0.30s}.panel>:nth-child(7){animation-delay:0.35s}.panel>:nth-child(8){animation-delay:0.40s}.panel>:nth-child(9){animation-delay:0.45s}.panel>:nth-child(10){animation-delay:0.50s}.panel>:nth-child(11){animation-delay:0.55s}.panel>:nth-child(12){animation-delay:0.60s}.panel>:nth-child(13){animation-delay:0.65s}.panel>:nth-child(14){animation-delay:0.70s}.panel>:nth-child(15){animation-delay:0.75s}
.ic{transition:transform .25s}
button:hover .ic{transform:scale(1.15) rotate(-6deg)}
#setb:hover .ic,#newtab:hover .ic{transform:rotate(90deg)}
#pinb:hover .ic{transform:rotate(25deg) scale(1.15)}
#back:hover .ic{transform:translateX(-3px)}#fwd:hover .ic{transform:translateX(3px)}#home:hover .ic{transform:translateY(-2px) scale(1.1)}
.hb:hover .ic{transform:scale(1.25) rotate(-12deg)}
#tabs,#bar{animation:down .5s both}
#modes{animation:pop .5s .3s both}
#bar .pick.on{animation:pulse 2.4s ease-in-out infinite}
.tab.on{box-shadow:inset 0 -2px var(--ac)}
.tab .fav{transition:transform .3s}.tab:hover .fav{transform:rotate(-10deg) scale(1.15)}
.tab b .ic{transition:transform .25s}.tab b:hover .ic{transform:rotate(90deg) scale(1.2)}
.tab.pinned{animation:pinned .5s both}
.tab.closing{animation:tabOut .22s forwards;pointer-events:none}
.view.on{animation:viewIn .3s both}
#pwbar .ic{animation:wiggle 1.2s ease-in-out infinite}#pwbar .btn{animation:pop .4s .15s both}
.pw{animation:slideIn .4s both;transition:background .2s,transform .2s}.pw:hover{background:#ffffff14;transform:translateX(4px)}
label.row{transition:transform .2s}label.row:hover{transform:translateX(4px)}
input[type=checkbox]{transition:transform .2s}input[type=checkbox]:active{transform:scale(.8)}input[type=checkbox]:checked{animation:pop .3s}
.btn:active{transform:scale(.92)}
.stats span:nth-child(2){animation-delay:.1s}.stats span:nth-child(3){animation-delay:.2s}
.r .top img{transition:transform .3s}.r:hover .top img{transform:scale(1.2) rotate(-8deg)}
.r a.t{background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .3s}
.r a.t:hover{text-decoration:none;background-size:100% 2px}
.sbox input::placeholder{transition:opacity .3s}.sbox input:focus::placeholder{opacity:.35}
.hint{animation:up .7s .9s both}.info{animation:up .5s both}
.loader p{animation:blink 1.4s ease-in-out infinite}
@keyframes down{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 8px color-mix(in srgb,var(--ac) 53%,transparent)}50%{box-shadow:0 0 20px var(--ac)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
@keyframes pinned{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes tabOut{to{opacity:0;transform:translateY(8px) scale(.8);min-width:0;max-width:0;padding:0}}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

#bmbar{display:none;gap:6px;padding:4px 10px;background:var(--bg);overflow-x:auto;animation:down .4s both}
#bmbar a{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;font-size:13px;color:var(--tx);white-space:nowrap;cursor:pointer;transition:background .2s,transform .2s}
#bmbar a:hover{background:var(--bg3);transform:translateY(-2px)}#bmbar img{width:16px;height:16px}
#starb.on .ic{fill:#f5c542;stroke:#f5c542;animation:pop .4s}
#menu{position:fixed;top:88px;right:12px;width:300px;max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain;background:#1c1c22;border:1px solid #333;border-radius:14px;padding:6px;z-index:40;display:none;box-shadow:0 12px 40px #000a}
#apps{position:fixed;top:92px;right:12px;width:340px;max-height:calc(100vh - 110px);overflow-y:auto;background:#1c1c22;border:1px solid #333;border-radius:16px;padding:16px;z-index:41;display:none;box-shadow:0 12px 40px #000a}
#apps.on{display:block;animation:pop .2s both}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.atile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:12px;cursor:pointer;font-size:12px;text-align:center;background:#ffffff08;transition:background .2s,transform .2s}
.atile:hover{background:var(--ac);transform:translateY(-3px)}.atile img{width:32px;height:32px;object-fit:contain;border-radius:6px}.atile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arm{position:absolute;top:2px;right:4px;background:none;border:0;color:#fff;font-size:16px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s}.atile:hover .arm{opacity:.8}
.aform{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #333}
.aform input{background:var(--bg3);color:var(--tx);border:1px solid #333;border-radius:10px;padding:9px 12px;outline:none;font:inherit;font-size:13px}.aform input:focus{border-color:var(--ac)}
#menu.on{display:block;animation:pop .2s both}#menu hr{border:0;border-top:1px solid #333;margin:4px 0}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;animation:slideIn .3s calc(var(--i)*.02s) both;transition:background .15s,transform .15s}
.mi:hover{background:var(--ac);transform:translateX(3px)}.mi span{flex:1}.mi small{color:var(--mu);font-size:11px}.mi:hover small{color:#fff}
#drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:#1c1c22f2;border-left:1px solid #333;z-index:45;padding:18px;overflow:auto;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px)}
#drawer.on{transform:none}#drawer h2{margin:0 0 12px;display:flex;align-items:center;gap:10px}
#drawer input{width:100%;background:var(--bg3);border:1px solid transparent;color:var(--tx);border-radius:10px;padding:9px 12px;margin-bottom:10px;outline:none}#drawer input:focus{border-color:var(--ac)}
.di{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;animation:slideIn .35s both;transition:background .2s,transform .2s}
.di:hover{background:#ffffff12;transform:translateX(4px)}.di img{width:20px;height:20px;flex:none}
.dn{flex:1;min-width:0;display:flex;flex-direction:column}.dn b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dn small{color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

Object.assign(TOOLS,{
 'HEX → RGB/HSL':v=>{const m=v.trim().replace('#','').match(/^([0-9a-f]{3}|[0-9a-f]{6})$/i);if(!m)throw new Error('Потрібен HEX, напр. #6c3df5');let x=m[1];if(x.length===3)x=[...x].map(c=>c+c).join('');const[r,g,b]=[0,2,4].map(i=>parseInt(x.substr(i,2),16));const R=r/255,G=g/255,B=b/255,M=Math.max(R,G,B),n=Math.min(R,G,B),l=(M+n)/2,d=M-n;let hh=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));hh=M===R?((G-B)/d)%6:M===G?(B-R)/d+2:(R-G)/d+4;hh=Math.round(hh*60);if(hh<0)hh+=360}return `rgb(${r}, ${g}, ${b})\nhsl(${hh}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`},

 'Підрахунок: рядки/слова/символи':v=>`рядків: ${v.split('\n').length}\nслів: ${(v.match(/\S+/g)||[]).length}\nсимволів: ${v.length}`,
 'Сортувати рядки':v=>v.split('\n').sort((a,b)=>a.localeCompare(b)).join('\n'),'Унікальні рядки':v=>[...new Set(v.split('\n'))].join('\n'),

 'HTML unescape':v=>v.replace(/&(amp|lt|gt|quot|#39);/g,(_,c)=>({amp:'&',lt:'<',gt:'>',quot:'"','#39':"'"}[c])),

const PGS={links:`[...new Set([...document.links].map(a=>a.href))].join('\\n')`,img:`[...new Set([...document.images].map(i=>i.currentSrc||i.src))].join('\\n')`,
 tech:`(()=>{const t=[],w=window,q=s=>document.querySelector(s);if(w.jQuery)t.push('jQuery '+w.jQuery.fn.jquery);if(w.React||q('[data-reactroot],#__next'))t.push('React / Next.js');if(w.Vue||q('[data-v-app]'))t.push('Vue');if(w.angular||q('[ng-version]'))t.push('Angular');if(w.__NUXT__)t.push('Nuxt');if(q('script[src*=bootstrap],link[href*=bootstrap]'))t.push('Bootstrap');if(q('script[src*=googletagmanager],script[src*=google-analytics]'))t.push('Google Analytics / GTM');if(q('link[href*=wp-content],script[src*=wp-content]'))t.push('WordPress');const g=q('meta[name=generator]');if(g)t.push('Generator: '+g.content);return t.join('\\n')||'Нічого не визначено'})()`,

$('#dev').onclick=async e=>{
  const t=e.target,w=web();
  if(t.closest('#devx'))return $('#dev').classList.remove('on');
  const k=t.closest('[data-k]');if(k)return setDevTab(k.dataset.k);

  const c=t.closest('[data-ck]');if(c){await window.nova.dev('delcookie',part(),cur.url,c.dataset.ck);return setDevTab('ck')}
  const g=t.closest('[data-pg]');if(g){const i=g.dataset.pg;
    if(i==='src')return viewSrc();if(!w)return;
    if(i==='shot'||i==='pdf'){const f=await window.nova.dev('shot',wid(),i==='pdf');return out('#pout','Збережено: '+f)}
    try{const v=await w.executeJavaScript(PGS[i],true);out('#pout',v===undefined?'Готово':typeof v==='string'?v:JSON.stringify(v,null,2))}catch(x){out('#pout','Помилка: '+x.message)}return}
  if(t.closest('#trun')){try{out('#tout',String(await TOOLS[$('#tsel').value]($('#tin').value)))}catch(x){out('#tout','Помилка: '+x.message)}return}
  const u=t.closest('[data-ua]');if(u&&w){try{w.setUserAgent(UAS[u.dataset.ua]);w.reload();out('#eout','User-Agent: '+u.dataset.ua)}catch(x){out('#eout',x.message)}return}

};
